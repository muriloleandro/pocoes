<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Poções e Soluções</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Gill+Sans&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Admin - Poções e Soluções</h1>
    </header>

    <main>
      <section id="add-potion">
        <h2>Adicionar Nova Poção</h2>
        <form id="add-potion-form">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required /><br />
          <label for="descricao">Descrição:</label>
          <textarea id="descricao" name="descricao" required></textarea><br />
          <label for="imagem">URL da Imagem:</label>
          <input type="text" id="imagem" name="imagem" required /><br />
          <label for="preco">Preço:</label>
          <input type="number" id="preco" name="preco" required /><br />
          <button type="submit">Adicionar Poção</button>
        </form>
      </section>

      <section id="potion-list">
        <h2>Poções Cadastradas</h2>
        <div id="admin-potions-container"></div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const potionsContainer = document.getElementById(
          "admin-potions-container"
        );
        const addPotionForm = document.getElementById("add-potion-form");

        async function fetchAndDisplayPotions() {
          const response = await fetch("/potions");
          const potions = await response.json();

          potionsContainer.innerHTML = "";

          potions.forEach((potion) => {
            const potionElement = document.createElement("div");
            potionElement.classList.add("potion-item");
            potionElement.innerHTML = `
              <span>${potion.nome}</span>
              <button data-id="${potion.id}" class="delete-btn">Remover</button>
            `;
            potionsContainer.appendChild(potionElement);
          });
        }

        addPotionForm.addEventListener("submit", async (event) => {
          event.preventDefault();

          const formData = new FormData(addPotionForm);
          const potionData = Object.fromEntries(formData.entries());

          await fetch("/potions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(potionData),
          });

          addPotionForm.reset();
          fetchAndDisplayPotions();
        });

        potionsContainer.addEventListener("click", async (event) => {
          if (event.target.classList.contains("delete-btn")) {
            const potionId = event.target.dataset.id;
            await fetch(`/potions/${potionId}`, {
              method: "DELETE",
            });
            fetchAndDisplayPotions();
          }
        });

        fetchAndDisplayPotions();
      });
    </script>
  </body>
</html>
